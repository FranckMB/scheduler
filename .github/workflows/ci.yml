name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Lint Docker Compose
        run: docker compose config > /dev/null

      - name: Lint Makefile
        run: make -n help

  # Frontend gate: until now the frontend had NO CI coverage — only the e2e job
  # touched it via `npm run dev` (Vite, no typecheck). A broken production build
  # (`tsc -b`) and failing Vitest units both slipped through. This job closes
  # that gap: typecheck + production build + unit tests on every PR.
  frontend:
    name: Frontend (build + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc -b + vite)
        working-directory: frontend
        run: npm run build

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npx vitest run

  # A18: blocking dependency-vulnerability audits, deliberately isolated in their OWN
  # job (no `needs`, and NOT a dependency of build-docker). A newly-disclosed advisory
  # against an unchanged package therefore reds only THIS check — which requires human
  # triage (bump the dep, or explicitly ignore the advisory) — without gating the image
  # build or the functional jobs on a commit that changed nothing.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # PHP — reads composer.lock, no vendor install needed. --abandoned=ignore: an
      # abandoned package is not a vulnerability (Composer 2.7+ would fail on it by default).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Composer audit
        working-directory: backend
        run: composer audit --locked --no-interaction --abandoned=ignore

      # Node — reads package-lock, no install needed. All deps are scanned (a runtime lib
      # misfiled under devDependencies still ships to browsers), gated at high+ so an
      # unfixable low/moderate advisory doesn't block every unrelated PR.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      # Python — audit the ENGINE IMAGE's actual installed versions (what ships), not a
      # fresh unpinned resolve. `pip freeze` omits pip/setuptools tooling by default, and
      # auditing the frozen list via an isolated pipx-run pip-audit means the tool never
      # perturbs (upgrades) the set it is meant to check. The local non-PyPI package is stripped.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: pip-audit
        run: |
          docker compose build engine
          docker compose run --rm --no-deps engine pip freeze | grep -vE '^(-e |clubscheduler-engine)' > engine-deps.txt
          pipx run pip-audit --requirement engine-deps.txt

  # Static analysis AND code style. CS-Fixer lives here rather than in the `lint`
  # job because it needs the PHP container this job already pays for (that job has
  # no PHP setup at all — it lints docker-compose + the Makefile in ~5 s). Same
  # gate either way: both feed `blocking-tests`.
  # Until 2026-07-17, CS-Fixer ran NOWHERE in CI — combined with the dormant
  # pre-commit hook (roadmap P4-11), nothing guarded PHP code style, and main was
  # merged red on it twice (PRs #241 and #244).
  phpstan:
    name: PHPStan & CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Start services
        run: docker compose up -d --wait php-fpm postgres redis

      - name: Install PHP deps
        run: docker compose exec -T php-fpm composer install --no-interaction

      - name: Run PHPStan
        run: docker compose exec -T php-fpm composer phpstan

      # Same command as `make -C backend cs` — dry-run, so CI reports the diff
      # instead of rewriting files. Fix locally with `make -C backend cs-fix`.
      - name: Run PHP-CS-Fixer (dry-run)
        run: docker compose exec -T php-fpm composer cs-fix -- --dry-run --diff

  # P4-24 : Rector dans son PROPRE job, sans `needs` et sans être
  # une dépendance de quoi que ce soit — exactement la forme de `dependency-audit`,
  # et pour la même raison. `rector.php` tire ses règles des versions INSTALLÉES
  # (`withComposerBased`, `withPreparedSets`) : un bump dependabot peut donc élargir
  # une règle et rougir ce check sur un commit qui n'a rien changé. Le mettre dans
  # `phpstan` ferait sauter `blocking-tests` (isolation tenant/RLS) et `build-docker`
  # pour de la dérive de STYLE — un signal de forme prendrait le déploiement en otage.
  # Ici il rougit seul, demande un arbitrage humain, et ne bloque ni tests ni images.
  # ⚠ POUR QU'IL BLOQUE LE MERGE, il faut ajouter le contexte « Rector (style gate) »
  # aux required status checks de `main` (réglage repo). Sans ça il rougit sans
  # empêcher quoi que ce soit — c'est le piège de sortir une étape d'un job requis.
  rector:
    name: Rector (style gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Start services
        run: docker compose up -d --wait php-fpm postgres redis

      - name: Install PHP deps
        run: docker compose exec -T php-fpm composer install --no-interaction

      # Dry-run : la CI rapporte le diff, elle ne réécrit pas. Pour CORRIGER en
      # local : `docker compose exec php-fpm sh -c 'cd /app/backend && composer rector'`
      # (`make -C backend rector` est lui aussi un dry-run — il montre, il ne fixe pas).
      - name: Run Rector (dry-run)
        run: docker compose exec -T php-fpm composer rector -- --dry-run

  blocking-tests:
    name: Blocking Tests
    runs-on: ubuntu-latest
    needs: [lint, phpstan]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      - name: Install PHP deps
        run: docker compose exec -T php-fpm composer install --no-interaction

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      # L'axe auth/memberships : sans ce test dans le gate BLOQUANT, une
      # re-suppression de `eraseCredentials` (bump Rector + `make rector` pour
      # verdir le job de style) passe tous les checks requis.
      - name: UserInterfaceContractTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Unit/Entity/UserInterfaceContractTest.php --group phase1'

      # NOTE : `SymfonyStackAlignmentTest` (dérive du stack hors LTS 7.4) tourne
      # dans `unit-tests`, PAS ici. Une chaîne de version n'a pas sa place dans
      # le job qui gate `build-docker` : un bump dependabot remontant un split
      # Symfony ferait rougir `blocking-tests` AVANT même que
      # TenantIsolationTest/RlsIsolationTest ne s'exécutent (étapes suivantes du
      # même job), et bloquerait le déploiement du correctif de sécurité que ce
      # bump apportait. C'est la raison exacte pour laquelle Rector a quitté le
      # job `phpstan` (P4-24 b) et pour laquelle `dependency-audit` n'a pas de
      # `needs` : une dérive de dépendance se signale, elle ne prend pas la
      # livraison en otage.

      - name: TenantIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/TenantIsolationTest.php --group phase1'

      - name: SeasonIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SeasonIsolationTest.php --group phase1'

      - name: SeasonReadonlyTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SeasonReadonlyTest.php --group phase1'

      - name: MatchTenantIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/MatchTenantIsolationTest.php --group phase1'

      - name: TenantCacheIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/TenantCacheIsolationTest.php --group phase1'

      - name: ConcurrentGenerationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Queue/ConcurrentGenerationTest.php --group phase1'

      - name: ContractSchemaTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/ContractSchemaTest.php --group phase1'

      - name: RlsIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/RlsIsolationTest.php --group phase1'

      - name: ClubUserAccessTests
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ClubAccessTest.php tests/Security/UserSelfOnlyTest.php tests/Security/ImportAuthorizationTest.php --group phase1'

      - name: MercureHardeningTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/MercureHardeningTest.php --group phase1'

      - name: ManagementRoleTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ManagementRoleTest.php --group phase1'

      - name: ApiRateLimitTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ApiRateLimitTest.php --group phase1'

      - name: SuperAdminAccessTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SuperAdminAccessTest.php --group phase1'

      - name: EngagedTeamGuardTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/EngagedTeamGuardTest.php --group phase1'

      - name: PeriodPlanBirthTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PeriodPlanBirthTest.php --group phase1'

      - name: SeasonVersionUniquenessTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SeasonVersionUniquenessTest.php --group phase1'

      - name: SeasonPlanInForceTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SeasonPlanInForceTest.php --group phase1'

      # P2-14 (axe constraint semantics) : le gate pré-solve valide EXACTEMENT le jeu de
      # contraintes que le payload sérialise — parité tenue par la source unique
      # PeriodConstraintSelector, plus par deux copies manuelles.
      - name: PeriodGatePayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PeriodGatePayloadParityTest.php --group phase1'

      # P2-9 PR A (axe constraint semantics) : le volet capacité du récap, dans les deux
      # sens — les nombres viennent du payload du solveur, jamais d'un recalcul à la main.
      - name: RecapCapacityWarningTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/RecapCapacityWarningTest.php --group phase1'

      - name: CoachDoubleBookingTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/CoachDoubleBookingTest.php --group phase1'

      # P2-9ter — le fichier portait déjà #[Group('phase1')] sans qu'AUCUN step de CE job
      # ne le lance : il tournait bien, mais dans `unit-tests` (qui exécute `phpunit
      # tests/`) — c'est-à-dire APRÈS `blocking-tests` et sans gater `build-docker`. Il ne
      # jouait donc pas le rôle de gate bloquant que son groupe annonçait. Il porte les NR
      # « le build n'écrit pas », « le write-path écrit vraiment », « ordre des tags
      # déterministe », « un seul chemin de calcul » et « cache scopé par saison ».
      - name: ScheduleConstraintBuilderOverlayTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/ScheduleConstraintBuilderOverlayTest.php --group phase1'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: blocking-tests
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      - name: Install PHP deps
        run: docker compose exec -T php-fpm composer install --no-interaction

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      - name: Run unit tests
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/'

  engine-tests:
    name: Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        run: docker compose build engine

      - name: Run pytest
        run: docker compose run --rm engine pytest

      - name: Run ruff
        run: docker compose run --rm engine ruff check .

      - name: Run mypy
        run: docker compose run --rm engine mypy

  engine-perf:
    name: Engine Perf Gate
    runs-on: ubuntu-latest
    # Perf gate is main-only. It guards the MVP "< 3 min" exit criterion and,
    # since the multi-worker fix, ratchets the large tier (dense + BCCL) to a
    # 60s budget so a regression to the single-worker prove-stall (612s) fails.
    if: github.ref == 'refs/heads/main'
    needs: engine-tests
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        run: docker compose build engine

      - name: Run perf gate
        run: docker compose run --rm engine pytest -m perf

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: blocking-tests
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # The journey drives the real stack: nginx (/api), engine (solve),
      # mercure, redis, postgres. messenger-worker starts AFTER composer
      # install — its `bin/console messenger:consume` command dies without
      # vendor/ on a fresh checkout and `--wait` would fail the job.
      - name: Start services
        run: docker compose up -d --wait php-fpm nginx engine mercure redis postgres

      - name: Install PHP deps
        run: docker compose exec -T php-fpm composer install --no-interaction

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Migrate dev database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:migrations:migrate --no-interaction'

      # matches.spec logs in as the BasketballInit-seeded club — append-load the
      # dev fixtures (idempotent, existing rows are reused, never purged).
      # BasketballInit REFUSES the app_user connection (RLS silently breaks the
      # purge — see the guard in BasketballInit::load): inject the admin URL, like
      # `make fixtures` (reads .env then .env.local, last wins), so the loader runs
      # as the superuser. Kept --append (never purge the seeded club) instead of
      # calling `make fixtures`, which reloads from scratch. Fail fast if the key
      # is missing — an empty DATABASE_URL suppresses the Dotenv fallback and would
      # abort with an opaque DSN error deep in the loader instead.
      - name: Load dev fixtures
        run: |
          docker compose exec -T php-fpm sh -c '
            cd /app/backend
            DBU=$(cat .env .env.local 2>/dev/null | sed -n "s/^DATABASE_ADMIN_URL=//p" | tail -n1 | tr -d "\"")
            [ -n "$DBU" ] || { echo "DATABASE_ADMIN_URL introuvable dans backend/.env — fixtures ne peuvent pas tourner sur la connexion admin"; exit 1; }
            DATABASE_URL="$DBU" php bin/console doctrine:fixtures:load --append --no-interaction
          '

      - name: Start messenger worker
        run: docker compose up -d --wait messenger-worker

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 1
          done
          echo "Vite dev server did not come up" && exit 1

      - name: Run Playwright suite
        working-directory: frontend
        run: E2E_BASE_URL=http://localhost:5173 npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # Semantic end-to-end smokes on a real stack — « les smokes doivent être joués
  # automatiquement et par la CI pour que l'on s'assure que les fonctionnalités
  # fonctionnent bien » (fondateur, 2026-08-03).
  #
  # NO `needs`: they answer « la fonctionnalité marche-t-elle ? », a question
  # independent of the unit/blocking suites — waiting for them only delayed the
  # answer (~13 min behind the e2e job, measured). Same reason dependency-audit
  # and rector have none. They need NO npm, NO Playwright, NO Vite: only the API
  # + the solver, so the job boots in a fraction of the e2e setup.
  #
  # Each script is self-sufficient (mints its JWT, creates AND cleans its data,
  # re-opens then RESTORES the season-plan pointer) — order is a convenience,
  # never a dependency. The solver smoke does leave the COMPLETED season
  # schedule the later ones pin, hence this ordering.
  smoke-tests:
    name: Smoke Tests (semantic e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # mailpit rides along (php-fpm depends_on it) — the onboarding smoke pulls
      # its verification link from it.
      - name: Start services
        run: docker compose up -d --wait php-fpm nginx engine mercure redis postgres

      - name: Install PHP deps
        run: docker compose exec -T php-fpm composer install --no-interaction

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Migrate dev database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:migrations:migrate --no-interaction'

      # The seeded club the solver/matches/overlay smokes drive. Same admin-URL
      # dance as the e2e job (BasketballInit refuses the app_user connection).
      - name: Load dev fixtures
        run: |
          docker compose exec -T php-fpm sh -c '
            cd /app/backend
            DBU=$(cat .env .env.local 2>/dev/null | sed -n "s/^DATABASE_ADMIN_URL=//p" | tail -n1 | tr -d "\"")
            [ -n "$DBU" ] || { echo "DATABASE_ADMIN_URL introuvable dans backend/.env — fixtures ne peuvent pas tourner sur la connexion admin"; exit 1; }
            DATABASE_URL="$DBU" php bin/console doctrine:fixtures:load --append --no-interaction
          '

      - name: Start messenger worker
        run: docker compose up -d --wait messenger-worker

      - name: Smoke — onboarding (register → minimum → COMPLETED)
        run: backend/scripts/onboarding-smoke.sh
      - name: Smoke — season solver (async rail → COMPLETED)
        run: backend/scripts/smoke-solver.sh
      - name: Smoke — match placement (sync rail, window honoured, named impossibility)
        run: backend/scripts/smoke-place-matches.sh
      - name: Smoke — period overlay (cockpit rail → COMPLETED)
        run: backend/scripts/smoke-overlay.sh
      - name: Smoke — coach wishes (campaign → public token → persisted wish)
        run: backend/scripts/smoke-coach-wishes.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 120 php-fpm engine messenger-worker

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [blocking-tests, engine-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build all images
        run: docker compose build

      # Prod images (docker-compose.prod.yml) — built here so the prod stack
      # cannot rot silently: a change that breaks the php prod stage (COPY +
      # composer --no-dev), the prod edge conf or the postgres init image reds
      # this job even though no dev build uses those targets.
      - name: Build prod images
        run: |
          docker build --target prod -f docker/php/Dockerfile .
          docker build --target nginx-prod -f docker/php/Dockerfile .
          docker build --target prod -f docker/frontend/Dockerfile .
          docker build -f docker/postgres/Dockerfile.prod .
