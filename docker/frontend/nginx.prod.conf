# PROD edge conf. Ses blocs `location` sont désormais les MÊMES que ceux de nginx.conf
# (dev) : l'en-tête disait « mirror MINUS the /engine/ location », mais ce proxy a été
# retiré du DEV aussi le 2026-07-31 — la différence annoncée n'existe plus (audit DOC-32,
# 2026-08-19). Ce qui distingue encore les deux fichiers tient au contexte d'exécution
# (upstreams, cache), pas à la surface exposée.
#
# ⚑ La raison de l'absence de /engine/ vaut pour LES DEUX : l'engine n'a aucune
# authentification (il fait confiance au réseau interne), le proxyer exposerait les solves
# CP-SAT (DoS + franchissement de tenant). Ne pas le rétablir, ici ou en dev.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    # Match the backend nginx (docker/nginx/default.conf) — without this the
    # nginx default of 1m rejects wizard .xlsx imports with 413 at the edge.
    client_max_body_size 20m;
    # Baseline headers at server level so EVERY response carries them — including
    # nginx-generated errors (502/504 when the /api upstream is down, 413/400)
    # that never reach the backend. The CSP is added ONLY in the HTML locations
    # (csp.conf), never here, so the /api and /exports proxies don't get a strict
    # default-src onto backend responses. Locations that set their own add_header
    # (content, /health) re-include the base (nginx doesn't inherit server-level
    # add_header into a location that has its own).
    include /etc/nginx/snippets/security-headers.conf;

    location = /health {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "healthy\n";
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /.well-known/mercure {
        set $mercure_upstream http://mercure:80;
        # SEC-14 : proxy PUBLIC par design (pas un endpoint X-Accel interne).
        proxy_pass $mercure_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SEC-14 : pas de forward d'Upgrade — Mercure est du SSE pur (HTTP long
        # stream), et forcer « Connection: upgrade » ouvrait le motif h2c smuggling.
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
    }

    location /api/ {
        set $api_upstream http://nginx:80;
        # SEC-14 : proxy PUBLIC par design (pas un endpoint X-Accel interne).
        proxy_pass $api_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend bundle assets (/api/docs swagger UI). Prefix location beats the
    # static-extension regex ONLY with ^~ — without it the regex catches
    # /bundles/*.css|png and 404s against the SPA root.
    location ^~ /bundles/ {
        set $bundles_upstream http://nginx:80;
        # SEC-14 : proxy PUBLIC par design (pas un endpoint X-Accel interne).
        proxy_pass $bundles_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exported PDF/PNG files served from the backend's public/exports.
    location ^~ /exports/ {
        set $exports_upstream http://nginx:80;
        # SEC-14 : proxy PUBLIC par design (pas un endpoint X-Accel interne).
        proxy_pass $exports_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pas de `location /engine/` — ni ici ni en dev (voir l'en-tête) : l'engine n'a pas d'auth.

    location / {
        # SPA shell: always revalidate so a redeploy's new asset hashes are picked
        # up (the exact `= /index.html` block above doesn't cover the try_files fallback).
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
