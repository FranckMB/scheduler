# Content-Security-Policy for the SPA HTML + assets ONLY (included alongside the
# baseline in the content locations). Kept off the /api and /exports proxy
# locations so a strict default-src can't break backend responses.
# (Plus de /engine ici : ce proxy n'existe dans AUCUNE conf — audit DOC-32.)
#
# ⚠ UNE SEULE exception d'hôte tiers est autorisée ici — Cloudflare Turnstile
# (challenges.cloudflare.com), posée d'office (décision fondateur P5-3b). Le reste
# est verrouillé, et c'est délibéré. Conséquence à connaître avant de brancher quoi
# que ce soit d'externe (P4-65) :
#
#   * Turnstile (P5-3b) — la preuve d'humanité de l'inscription. Le widget charge un
#     script depuis challenges.cloudflare.com (→ `script-src`) et se rend dans une
#     iframe servie par ce même hôte (→ `frame-src`, directive AJOUTÉE ici). Ces deux
#     hôtes suffisent : l'iframe est isolée, ses appels réseau ne relèvent pas du
#     `connect-src` de la page parente (doc Cloudflare Turnstile CSP). Gardé par
#     `frontend/tooling/turnstileCsp.test.ts` (les 2 directives doivent porter l'hôte).
#   * Sentry — poser `VITE_SENTRY_DSN` NE SUFFIT PAS. Sans l'hôte d'ingestion du DSN dans
#     `connect-src`, le navigateur jette chaque envoi EN SILENCE : le SDK s'initialise, tout
#     paraît instrumenté, rien n'arrive. Un garde de build (`frontend/tooling/sentryCspGuard.ts`)
#     fait désormais échouer le build si le DSN est posé sans son hôte — mais c'est ICI que
#     l'hôte s'ajoute.
#   * Tuiles de carte — même règle. Une carte demanderait un hôte de tuiles dans `img-src`,
#     ou un proxy backend qui garde tout en same-origin (piste privilégiée, cf.
#     `specs/evolution/ffbb-appariement-source-de-verite.md`).
#
# Tuned to the Vite build: the bundled module script + the Turnstile loader
# (script-src 'self' + challenges.cloudflare.com), an external stylesheet + React
# inline style attributes (style-src 'self' 'unsafe-inline'), same-origin XHR to
# /api, /.well-known/mercure plus blob: (connect-src — ClubPage recrop
# fetch()es the logo object URL), same-origin images with data:/blob: (logo cropper
# preview, palette extraction), and the Turnstile iframe (frame-src).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
