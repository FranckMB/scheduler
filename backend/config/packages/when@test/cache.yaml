framework:
    cache:
        app: cache.adapter.array
        pools:
            # P2-12 : cache.tenant supprimé (aucun writer) — miroir de cache.yaml.
            # P2-9ter — `tags: true` comme en prod (cache.yaml). Le payload solveur est
            # purgé par TAG (CacheInvalidationListener) : sans ça le pool n'est pas
            # tag-aware, `CacheInvalidationListener` ne peut plus être autowiré et le
            # conteneur de test ne compile pas.
            cache.schedule:
                adapter: cache.adapter.array
                tags: true
