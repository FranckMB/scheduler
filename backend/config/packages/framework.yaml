# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Derrière le reverse-proxy (nginx docker forwarde X-Forwarded-*), le client réel n'est
    # lisible QUE si les proxys internes sont de confiance ; sinon getClientIp() renvoie l'IP
    # de la passerelle et les rate-limits par IP (page publique doléances, admin, API) se
    # réduisent à un compartiment global (anti-énumération inexistante + self-DoS). `default:`
    # → override prod par SYMFONY_TRUSTED_PROXIES (liste d'IP exactes), repli `private_ranges`
    # (RFC1918, couvre les réseaux docker) sinon.
    trusted_proxies: '%env(default:trusted_proxies_fallback:SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

    #esi: true
    #fragments: true

parameters:
    trusted_proxies_fallback: 'private_ranges'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
